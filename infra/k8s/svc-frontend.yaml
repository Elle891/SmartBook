# ─── svc-frontend: Nginx Deployment ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-frontend
  namespace: smart-accounting
  labels:
    app: svc-frontend
    component: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: svc-frontend
      component: nginx
  template:
    metadata:
      labels:
        app: svc-frontend
        component: nginx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: nginx
          image: ghcr.io/your-org/smart-accounting/svc-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: svc-frontend
---
# ─── svc-frontend: Service ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: svc-frontend
  namespace: smart-accounting
  labels:
    app: svc-frontend
spec:
  selector:
    app: svc-frontend
    component: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
# ─── svc-frontend: HPA ────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: svc-frontend-hpa
  namespace: smart-accounting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: svc-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
