# ─── svc-accounting: FastAPI Deployment ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-accounting
  namespace: smart-accounting
  labels:
    app: svc-accounting
    component: api
    app.kubernetes.io/part-of: smart-accounting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: svc-accounting
      component: api
  template:
    metadata:
      labels:
        app: svc-accounting
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: svc-accounting
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: fastapi
          image: ghcr.io/your-org/smart-accounting/svc-accounting:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: accounting-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: accounting-secrets
                  key: database-url
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: vault-token
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: svc-accounting
---
# ─── svc-accounting: Celery Worker Deployment ────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-accounting
  namespace: smart-accounting
  labels:
    app: svc-accounting
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: svc-accounting
      component: celery-worker
  template:
    metadata:
      labels:
        app: svc-accounting
        component: celery-worker
    spec:
      serviceAccountName: svc-accounting
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: celery-worker
          image: ghcr.io/your-org/smart-accounting/svc-accounting:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - app.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - -Q
            - accounting
          envFrom:
            - configMapRef:
                name: accounting-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: accounting-secrets
                  key: database-url
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: vault-token
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
# ─── svc-accounting: Service ──────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: svc-accounting
  namespace: smart-accounting
  labels:
    app: svc-accounting
spec:
  selector:
    app: svc-accounting
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
# ─── svc-accounting: HPA ─────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: svc-accounting-hpa
  namespace: smart-accounting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: svc-accounting
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-accounting-hpa
  namespace: smart-accounting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker-accounting
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
