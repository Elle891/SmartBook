# Tsinghua PyPI mirror — use domestic source instead of pypi.org
# Apply: set PIP_CONFIG_FILE=backend/pip.conf  (Windows, from repo root)
#        export PIP_CONFIG_FILE=backend/pip.conf  (Linux/macOS)
[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
trusted-host = pypi.tuna.tsinghua.edu.cn
timeout = 120
