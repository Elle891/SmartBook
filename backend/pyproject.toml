[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-accounting-backend"
version = "0.1.0"
description = "Smart Accounting Software — multi-tenant cloud accounting platform"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # ORM & database
    "sqlalchemy[asyncio]>=2.0.29",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",

    # Task queue
    "celery[redis]>=5.3.6",
    "redis>=5.0.3",

    # Validation
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",

    # Authentication & encryption
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.5",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.2,<4.0",

    # Secrets management
    "hvac>=2.1.0",

    # HTTP client
    "httpx>=0.27.0",
    "tenacity>=8.2.3",

    # Observability
    "prometheus-fastapi-instrumentator>=6.4.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-exporter-jaeger>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.44b0",
    "opentelemetry-instrumentation-celery>=0.44b0",
    "opentelemetry-instrumentation-redis>=0.44b0",
    "opentelemetry-instrumentation-httpx>=0.44b0",

    # NLP
    "langchain>=0.1.16",
    "langchain-community>=0.0.34",
    "sentence-transformers>=2.7.0",
    "spacy>=3.7.4",

    # ML
    "prophet>=1.1.5",
    "torch>=2.2.2",
    "pytorch-forecasting>=1.0.0",
    "scikit-learn>=1.4.1",
    "mlflow>=2.11.1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "joblib>=1.3.2",

    # Report generation
    "weasyprint>=61.2",
    "openpyxl>=3.1.2",

    # Notifications
    "boto3>=1.34.74",

    # MCP (partial agent tool surface)
    "mcp>=1.0.0",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=21.2.0",
]

dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.1",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "types-redis>=4.6.0.20240311",
    "types-passlib>=1.7.7.20240327",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "app"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]
