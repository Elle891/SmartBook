# Optional: use PostgreSQL as the platform center (registry) database instead of MySQL.
#   docker compose -f docker-compose.yml -f docker-compose.platform-postgres.yml up -d

services:
  svc-accounting:
    environment:
      PLATFORM_DB_TYPE: postgresql
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/platform_registry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-dev:
        condition: service_started

  celery-worker:
    environment:
      PLATFORM_DB_TYPE: postgresql
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/platform_registry
