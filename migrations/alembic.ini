# Alembic configuration for multi-tenant migrations.
# The TENANT_DB_URL environment variable is set by the provisioner/platform-admin
# to point at the specific tenant database being migrated.

[alembic]
script_location = migrations
prepend_sys_path = .

# TENANT_DB_URL / PLATFORM_DB_URL are injected at runtime by env.py
# (avoid ConfigParser %(…) interpolation — env.py always overrides this URL)
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
